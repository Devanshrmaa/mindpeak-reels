name: Send Outreach Emails

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only — no emails sent)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      target_id:
        description: 'Send only this target ID (leave blank to send all)'
        required: false
        default: ''

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send outreach emails
        env:
          OUTREACH_SMTP_USER: ${{ secrets.OUTREACH_SMTP_USER }}
          OUTREACH_SMTP_PASS: ${{ secrets.OUTREACH_SMTP_PASS }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TARGET_ID: ${{ github.event.inputs.target_id }}
        run: node scripts/send-outreach.mjs
